<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - Перенаправлення...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            text-align: center;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div>
        <div class="loader"></div>
    </div>

    <script>
        // JavaScript функція для перенаправлення
        setTimeout(function() {
            // Вкажи тут назву файлу, на який треба перейти
            window.location.href = "login.html"; 
        }, 3000); // 3000 мілісекунд = 3 секунди
    </script>

</body>
</html>
