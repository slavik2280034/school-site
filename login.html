<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="header-text">
            <h1>Вітаю на персональному проекті 7-В класу!</h1>
            <p>Проект розрахований на велику спільноту.</p>
            <div class="warning-box">
                <span>⚠️</span>
                <p>Увага! Сайт у розробці, більшість функцій можуть не працювати. Вибачте!</p>
            </div>
        </div>

        <div class="content">
            <form>
                <input type="text" placeholder="Ім'я">
                <input type="text" placeholder="Прізвище">
                <input type="text" placeholder="наша електронна пошта">
                <input type="email" placeholder="ваша електронна пошта">
                <input type="tel" placeholder="номер телефону">

                <button type="submit" disabled class="disabled-btn">відправити</button>
            </form>

            <div>
                <a href="index.html">доступно на тестуванні!(перехід на головну)</a>
            </div>

            <div class="register-link">
                <p>Немає акаунту?</p>
                <button class="secondary-btn" onclick="window.location.href='registration.html'">
                    Зареєструватися
                </button>
            </div>

            <div class="warning-text">
                <p>Увага! Проект ще не запущений, прошу зайдіть пізніше.</p>
            </div>
        </div>
    </div>
</body>

</html>
